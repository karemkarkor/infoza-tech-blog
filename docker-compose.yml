services:
  db:
    image: postgres:17-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-prisma_Blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-prisma_Blog}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prisma_Blog} -d ${DB_NAME:-prisma_Blog}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env


volumes:
  blog-postgres-data:
